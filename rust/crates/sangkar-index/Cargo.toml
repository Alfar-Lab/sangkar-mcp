[package]
name = "sangkar-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sangkar-core = { path = "../sangkar-core" }
sangkar-store = { path = "../sangkar-store" }
sangkar-domain = { path = "../sangkar-domain" }
# The extractor's `is_test` predicate applies the language row's `testFileRegex`, which the TypeScript
# table held as a `RegExp` builtin. `regex` is its Rust counterpart and is already in the build graph
# (`tree-sitter` depends on it), so this manifest edge adds no crate to the lock. `serde_json` is the
# pin `sangkar-core` already builds with, needed because `node.props` is JSON text in the schema.
regex = "1.13"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.24"
tree-sitter-php = "0.25"
tree-sitter-ruby = "0.23"

[lints]
workspace = true
