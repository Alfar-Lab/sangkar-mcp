# One tag, one target, two artifacts, and no publish. The runner image decides the glibc floor:
# `ubuntu-22.04` links against glibc 2.35, so the binary runs on 2.35 and newer and nowhere older.
# That floor is a property of this line and is restated in the release notes, because moving the
# runner is a change every user's libc has to survive.
#
# `workflow_dispatch` builds and uploads the same artifacts without a tag, so a release can be
# rehearsed (and its tarball published by hand) without creating a GitHub Release.
name: release

on:
  push:
    # v[MAJOR].[MINOR].[PATCH]-[TAG].[ITERATION], e.g. v0.7.0-beta.1 or v0.7.0
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET: x86_64-unknown-linux-gnu
  KEY: linux-x64-gnu
  PACKAGE: sangkar-mcp-linux-x64-gnu
  GLIBC_FLOOR: "2.35"

jobs:
  linux-x64-gnu:
    name: linux x64 (glibc 2.35)
    runs-on: ubuntu-22.04
    permissions:
      # Creating the Release is the only privileged thing this workflow does.
      contents: write
    steps:
      # Shallow on purpose: the notes are written below with `generate_release_notes: false` and
      # nothing here walks history — the version comes from `package.json`, not `git describe`.
      - uses: actions/checkout@v4

      - name: Toolchain 1.100.0 with the release target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: ${{ env.TARGET }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Read the version npm will publish
        id: version
        run: |
          echo "version=$(node -e 'process.stdout.write(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Build the platform package
        # `package.sh` is the whole build: it runs
        # `cargo build --release --locked -p sangkar-cli --target x86_64-unknown-linux-gnu`, installs
        # the binary into `npm/<KEY>/bin/sangkar`, strips it, and writes that directory's
        # `package.json` from the root one (refusing if `optionalDependencies` disagrees). Burning
        # another `cargo build` here would produce the same binary twice.
        run: bash rust/scripts/package.sh

      - name: Check the binary and the floor it needs
        run: |
          set -euo pipefail
          binary="npm/$KEY/bin/sangkar"
          test -x "$binary" || { echo "$binary is missing or not executable" >&2; exit 1; }

          magic="$(od -An -tx1 -N4 "$binary" 2>/dev/null | tr -d ' \n' || true)"
          machine="$(od -An -tx1 -j18 -N2 "$binary" 2>/dev/null | tr -d ' \n' || true)"
          [ "$magic" = "7f454c46" ] || { echo "$binary is not an ELF file" >&2; exit 1; }
          [ "$machine" = "3e00" ] || { echo "$binary is not x86-64 (e_machine=$machine)" >&2; exit 1; }

          # The promise the runner image makes: the highest glibc symbol version the binary links
          # against. Anything above the floor means the build picked up a newer libc than promised.
          highest="$(objdump -T "$binary" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1 || true)"
          [ -n "$highest" ] || { echo "no glibc symbol versions found in $binary" >&2; exit 1; }
          if [ "$(printf '%s\n%s\n' "$highest" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
            echo "$binary needs glibc $highest, above the $GLIBC_FLOOR floor of ubuntu-22.04" >&2
            exit 1
          fi

          echo "elf:         $(file -b "$binary")"
          echo "glibc floor: $highest (this release promises <= $GLIBC_FLOOR)"
          echo "size:        $(stat -c %s "$binary") bytes ($(du -h "$binary" | cut -f1))"
          sha256sum "$binary"

      - name: Assemble the release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # A re-run in a dirty workspace must not fold an old binary into the tarball.
          rm -rf dist/package
          mkdir -p dist/package

          # The npm platform package in the layout `npm pack` produces: one `package/` root holding
          # `package.json` and `bin/sangkar`, which is the shape the registry takes as already packed.
          # npm lists only those two files; this tarball also carries their directory entries, which
          # `npm install` and `tar` both take, and the file paths are identical.
          cp -a "npm/$KEY/." dist/package/
          tar -czf "dist/$PACKAGE-$VERSION.tgz" -C dist package

          # The bare binary, for a user who wants the file and not npm.
          tar -czf "dist/sangkar-$VERSION-$TARGET.tar.gz" -C "npm/$KEY/bin" sangkar

          echo "--- $PACKAGE-$VERSION.tgz ---"
          tar -tzf "dist/$PACKAGE-$VERSION.tgz"
          echo "--- sangkar-$VERSION-$TARGET.tar.gz ---"
          tar -tzf "dist/sangkar-$VERSION-$TARGET.tar.gz"
          sha256sum dist/*.tgz dist/*.tar.gz

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sangkar-linux-x64-gnu
          path: |
            dist/*.tgz
            dist/*.tar.gz
          if-no-files-found: error

      # Only a tag creates a Release. A `workflow_dispatch` run on a branch stops at the artifacts.
      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # `v0.6.0-beta.1` carries the `-` a pre-release takes; `v0.6.0` does not.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          files: |
            dist/*.tgz
            dist/*.tar.gz
          body: |
            One binary, one target: `${{ env.TARGET }}`, built on `ubuntu-22.04`.

            ## The glibc floor

            This build needs **glibc 2.35 or newer** — Debian 12, Ubuntu 22.04+, Fedora 36+ — because
            the runner image decides which libc symbols the linker may use. Older distributions fail
            at load time on a `GLIBC_2.35` symbol version, and no build of this release targets them.

            macOS and Windows are not published yet; `bin/sangkar.js` names the platforms that are.

            ## Assets

            | File | What it is |
            |---|---|
            | `sangkar-${{ steps.version.outputs.version }}-${{ env.TARGET }}.tar.gz` | the stripped binary |
            | `${{ env.PACKAGE }}-${{ steps.version.outputs.version }}.tgz` | the same binary as the npm platform package |

            ## Publishing is the maintainer's step, not CI's

            This Release is where CI stops. The two npm packages go out by hand, in this order — the
            platform package first, the parent second:

            1. `sangkar-mcp-linux-x64-gnu`, from `./npm/linux-x64-gnu` in this checkout.
            2. `sangkar-mcp`, from the repository root.

            The platform package goes first because the parent is only a launcher: `bin/sangkar.js`
            resolves `sangkar-mcp-linux-x64-gnu` with `require.resolve` and exits 70 when that lookup
            finds nothing. Publishing the parent first would advertise an install that cannot start a
            server for as long as the platform package is missing.

            The publish needs an OTP that only the maintainer has, which is why it does not run in
            CI. `--tag beta` while the version carries a pre-release suffix, `--tag latest` once it
            does not. The commands, the preflight and the README sync live in
            `.agents/skills/build-n-deploy/SKILL.md` §9.
