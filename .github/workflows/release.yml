# One tag, one target, two assets, and no publish. The runner image decides the glibc floor:
# `ubuntu-22.04` links against glibc 2.35, so the binary runs on 2.35 and newer and nowhere older.
# That floor is a property of this line and is restated in the release notes, because moving the
# runner is a change every user's libc has to survive.
#
# The build happens here rather than in a packaging script: `install.sh` downloads the tarball and
# verifies it against `SHA256SUMS`, so this file produces both assets itself. The version in their
# names comes from `rust/Cargo.toml`'s `[workspace.package]`, and a tag that disagrees with it fails
# before a single crate is compiled.
#
# `workflow_dispatch` builds and uploads the same assets without a tag, so a release can be
# rehearsed without creating a GitHub Release. It skips the tag/version gate, which only a tag has
# anything to check.
name: release

on:
  push:
    # v[MAJOR].[MINOR].[PATCH]-[TAG].[ITERATION], e.g. v0.7.0-beta.1 or v0.7.0
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET: x86_64-unknown-linux-gnu
  GLIBC_FLOOR: "2.35"

jobs:
  linux-x64:
    name: linux x64 (glibc 2.35)
    runs-on: ubuntu-22.04
    permissions:
      # Creating the Release is the only privileged thing this workflow does.
      contents: write
    steps:
      # Shallow on purpose: the notes are written below with `generate_release_notes: false` and
      # nothing here walks history — the version comes from `rust/Cargo.toml`, not `git describe`.
      - uses: actions/checkout@v4

      - name: Toolchain 1.100.0 with the release target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: ${{ env.TARGET }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Read the version from Cargo.toml
        id: version
        run: |
          set -euo pipefail
          # `[workspace.package]` is the one place the version lives; every member inherits it and
          # `rust/Cargo.lock` mirrors it. Read with awk so learning it costs no Node runtime.
          version="$(awk '/^\[workspace\.package\]/{f=1; next} /^\[/{f=0} f && /^version *=/{gsub(/"/,"",$3); print $3; exit}' rust/Cargo.toml)"
          [ -n "$version" ] || { echo "no version in [workspace.package] of rust/Cargo.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A tag is a promise about which version it carries. The assets below are named from
      # `rust/Cargo.toml`, so a tag that disagrees would publish a Release advertising one version
      # and shipping another. Only a tag is checked: a dispatch run has no version to agree with.
      - name: Check the tag against the Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          expected="v$VERSION"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version $VERSION (expected $expected)" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches $VERSION"

      - name: Build the release binary
        # `--locked`: a stale `rust/Cargo.lock` fails here instead of being rewritten behind the
        # release's back. This is the only build of the binary; every asset below reuses its output.
        working-directory: rust
        run: cargo build --release --locked -p sangkar-cli --target "$TARGET"

      - name: Strip the binary
        # `strip` mutates `rust/target/$TARGET/release/sangkar` in place, and that path is cargo's
        # shared build output: a `cargo test` later in this job would relink against a stripped
        # binary. Nothing runs tests here today; adding one means stripping a copy instead.
        run: strip "rust/target/$TARGET/release/sangkar"

      - name: Check the binary and the floor it needs
        run: |
          set -euo pipefail
          binary="rust/target/$TARGET/release/sangkar"
          test -x "$binary" || { echo "$binary is missing or not executable" >&2; exit 1; }

          magic="$(od -An -tx1 -N4 "$binary" 2>/dev/null | tr -d ' \n' || true)"
          machine="$(od -An -tx1 -j18 -N2 "$binary" 2>/dev/null | tr -d ' \n' || true)"
          [ "$magic" = "7f454c46" ] || { echo "$binary is not an ELF file" >&2; exit 1; }
          [ "$machine" = "3e00" ] || { echo "$binary is not x86-64 (e_machine=$machine)" >&2; exit 1; }

          # The promise the runner image makes: the highest glibc symbol version the binary links
          # against. Anything above the floor means the build picked up a newer libc than promised.
          highest="$(objdump -T "$binary" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -1 || true)"
          [ -n "$highest" ] || { echo "no glibc symbol versions found in $binary" >&2; exit 1; }
          if [ "$(printf '%s\n%s\n' "$highest" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
            echo "$binary needs glibc $highest, above the $GLIBC_FLOOR floor of ubuntu-22.04" >&2
            exit 1
          fi

          echo "elf:         $(file -b "$binary")"
          echo "glibc floor: $highest (this release promises <= $GLIBC_FLOOR)"
          echo "size:        $(stat -c %s "$binary") bytes ($(du -h "$binary" | cut -f1))"
          sha256sum "$binary"

      - name: Assemble the release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # A re-run in a dirty workspace must not fold an old tarball into the checksums.
          rm -rf dist
          mkdir -p dist

          # One entry at the archive root, mode 0755 as cargo built it: `tar -xzf` then installs the
          # file `install.sh` expects without walking a directory tree.
          tar -czf "dist/sangkar-$VERSION-$TARGET.tar.gz" -C "rust/target/$TARGET/release" sangkar

          # The name here is the file as it sits on disk, with no `dist/` prefix: `install.sh` reads
          # this file and matches the tarball name byte for byte, and a prefixed line matches nothing.
          ( cd dist && sha256sum "sangkar-$VERSION-$TARGET.tar.gz" > SHA256SUMS )

          echo "--- sangkar-$VERSION-$TARGET.tar.gz ---"
          tar -tzvf "dist/sangkar-$VERSION-$TARGET.tar.gz"
          echo "--- SHA256SUMS ---"
          cat dist/SHA256SUMS

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sangkar-linux-x64
          path: |
            dist/sangkar-${{ steps.version.outputs.version }}-${{ env.TARGET }}.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      # Only a tag creates a Release. A `workflow_dispatch` run on a branch stops at the artifacts.
      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # `v0.7.0-beta.1` carries the `-` a pre-release takes; `v0.7.0` does not.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          files: |
            dist/sangkar-${{ steps.version.outputs.version }}-${{ env.TARGET }}.tar.gz
            dist/SHA256SUMS
          body: |
            One binary, one target: `${{ env.TARGET }}`, built on `ubuntu-22.04`.

            ## The glibc floor

            This build needs **glibc 2.35 or newer** — Debian 12, Ubuntu 22.04+, Fedora 36+ — because
            the runner image decides which libc symbols the linker may use. Older distributions fail
            at load time on a `GLIBC_2.35` symbol version, and no build of this release targets them.

            ## Assets

            | File | What it is |
            |---|---|
            | `sangkar-${{ steps.version.outputs.version }}-${{ env.TARGET }}.tar.gz` | the stripped binary, as one `sangkar` at the archive root |
            | `SHA256SUMS` | the checksum `install.sh` verifies that tarball against |

            ## Install

            ```
            curl -fsSL https://raw.githubusercontent.com/Alfar-Lab/sangkar-mcp/main/install.sh | sh
            ```

            `install.sh` installs to `~/.local/bin`. It refuses every platform but Linux x86_64 with
            glibc 2.35 or newer, and says what it found instead of installing a binary that cannot
            start. macOS and Windows are not published: this Release is the only platform the
            project ships.
